# Here is custom binds for you, edit as you want
# ~/.config/hypr/User_Keybinds.conf
bind = $mainMod, T, exec, Telegram

#script by AskarBink
bind = , End, exec, $scripts/schoolshooter.sh rc
bind = $mainMod, End, exec, $scripts/schoolshooter.sh rf
bind = CTRL, End, exec, $scripts/schoolshooter.sh ri
bind = SHIFT, End, exec, $scripts/schoolshooter.sh sc
bind = $mainMod SHIFT, End, exec, $scripts/schoolshooter.sh sf
bind = CTRL SHIFT, End, exec, $scripts/schoolshooter.sh si 
bind = ALT, End, exec, $scripts/schoolshooter.sh p

bind = $mainMod, F, exec, discord --proxy-server="socks5://127.0.0.1:10808"
bind = $mainMod SHIFT, SPACE, exec, $scripts/toggle-window-size.sh 600
bind = $mainMod CTRL, SPACE, exec, $scripts/toggle-window-size.sh 200 400

#script by BryanCuneo
bind = ALT, tab, exec, $userscripts/focus-next-audio-stream.sh

bind = $mainMod, TAB, submap, switch_ws

submap = switch_ws

bind = $mainMod, 1, workspace, 5
bind = $mainMod, 2, workspace, 6
bind = $mainMod, 3, workspace, 7
bind = $mainMod, 4, workspace, 8

bind = , escape, submap, reset

submap = reset

bind = $mainMod, J, exec, $userscripts/toggle-fcitx5.sh
bind = $mainMod, M, exec, obsidian
