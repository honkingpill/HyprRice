# ~/.config/hypr/Display.conf
# 888888ba  oo                   dP                   
# 88    `8b                      88                   
# 88     88 dP .d8888b. 88d888b. 88 .d8888b. dP    dP 
# 88     88 88 Y8ooooo. 88'  `88 88 88'  `88 88    88 
# 88    .8P 88       88 88.  .88 88 88.  .88 88.  .88 
# 8888888P  dP `88888P' 88Y888P' dP `88888P8 `8888P88 
#                       88                        .88 
#                       dP                    d8888P  
# =================================
windowrule{
name= floating
match:class = float
size = 800 600
animation = popin 
float = on
center = on
}
windowrule{
name = Pipewire 
match:class = org.pipewire.Helvum
size = 1100 850
center = on
animation = popin
float = on
pin = on
}
windowrule{
name = HyprshotGUI
match:title = Hyprshot
match:class = python3
center = on 
pin = on
animation = popin
float = on
stay_focused = on
size = 350 300
}
windowrule{
name = telegram
match:class = org.telegram.desktop
float = on
pin = on 
move = 0 0
size = 600 1070
animation = slide
}
windowrule{
name = discord
match:class = discord  
float = on
pin = on 
move = 0 0
size = 415 700

}
windowrule{
    name=thunar
    match:class = thunar
    float = on
}
windowrule{
name = pip
match:class = firefox
match:title = Picture-in-Picture
pin = on
float = on
center = on
move = 0 0
size= 450 250
}
layerrule = animation slide right on, match:namespace swaync-control-center
